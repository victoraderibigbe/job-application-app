<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Applicant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-4">
      <div class="w-50 shadow rounded p-4 mx-auto">
        <h2 class="text-center text-success mb-4">Edit Applicant</h2>

        <form
          th:action="@{/applicants/edit/{id}(id=${applicant.id})}"
          th:object="${applicant}"
          method="post"
        >
          <div class="mb-3 d-flex gap-2 align-items-center">
            <div class="w-100">
              <label for="firstName" class="form-label">First Name:</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                th:value="*{firstName}"
                class="form-control"
                required
              />
            </div>

            <div class="w-100">
              <label for="lastName" class="form-label">Last Name:</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                th:value="*{lastName}"
                class="form-control"
                required
              />
            </div>
          </div>

          <div class="mb-3 d-flex gap-2 align-items-center">
            <div class="w-100">
              <label for="email" class="form-label">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                th:value="*{email}"
                class="form-control"
                required
              />
            </div>
            <div class="w-100">
              <label for="phoneNumber" class="form-label">Phone Number:</label>
              <input
                type="text"
                id="phoneNumber"
                name="phoneNumber"
                th:value="*{phoneNumber}"
                class="form-control"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input
              type="text"
              id="address"
              name="address"
              th:value="*{address}"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="profession" class="form-label">Profession</label>
            <input
              type="text"
              id="profession"
              name="profession"
              th:value="*{profession}"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label for="hobby" class="form-label">Hobby</label>
            <input
              type="text"
              id="hobby"
              name="hobby"
              th:value="*{hobby}"
              class="form-control"
            />
          </div>

          <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input
              type="number"
              id="age"
              name="age"
              th:value="*{age}"
              class="form-control"
            />
          </div>

          <div class="d-flex gap-2">
            <a href="/applicants" class="btn btn-secondary w-100">Cancel</a>
            <button type="submit" class="btn btn-success w-100">
              Update Job Details
            </button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
