<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Applicant</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-4">
      <h2>Applicant Details</h2>
      <p>
        <strong>First Name:</strong>
        <span th:text="${applicant.firstName}"></span>
      </p>
      <p>
        <strong>Last Name:</strong>
        <span th:text="${applicant.lastName}"></span>
      </p>
      <p><strong>Email:</strong> <span th:text="${applicant.email}"></span></p>
      <p>
        <strong>Phone Number:</strong>
        <span th:text="${applicant.phoneNumber}"></span>
      </p>
      <p>
        <strong>Address:</strong> <span th:text="${applicant.address}"></span>
      </p>
      <p>
        <strong>Profession:</strong>
        <span th:text="${applicant.profession}"></span>
      </p>
      <p><strong>Hobby:</strong> <span th:text="${applicant.hobby}"></span></p>
      <p><strong>Age:</strong> <span th:text="${applicant.age}"></span></p>
      <a href="/applicants" class="btn btn-primary">Back to List</a>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
