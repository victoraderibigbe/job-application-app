<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applicants</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-4">
      <h2 class="text-center">Applicants List</h2>
      <div class="d-flex gap-2 my-2">
        <a href="/" class="btn btn-secondary">Back</a>
        <a href="/download-file" class="btn btn-primary">Export Details</a>
      </div>
      <table class="table table-bordered table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="applicant : ${applicants}">
            <td th:text="${applicant.id}"></td>
            <td th:text="${applicant.firstName}"></td>
            <td th:text="${applicant.lastName}"></td>
            <td th:text="${applicant.email}"></td>
            <td th:text="${applicant.phoneNumber}"></td>
            <td>
              <a
                th:href="@{/applicants/view/{id}(id=${applicant.id})}"
                class="btn btn-info btn-sm"
                >View</a
              >
              <a
                th:href="@{/applicants/edit/{id}(id=${applicant.id})}"
                class="btn btn-warning btn-sm"
                >Edit</a
              >
              <a
                th:href="@{/applicants/delete/{id}(id=${applicant.id})}"
                class="btn btn-danger btn-sm"
                onclick="return confirm('Are you sure you want to delete this applicant?');"
                >Delete</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
